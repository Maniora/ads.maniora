<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Maniora</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg-light); text-align: center; padding: 2rem;">
    <div style="max-width: 500px; padding: 3rem 2rem; background: #FFFFFF; border-radius: 1.5rem; border: 1px solid rgba(26,25,23,0.07); box-shadow: 0 12px 32px -4px rgba(0,0,0,0.05);">
        <span class="font-mono" style="font-size: 0.8rem; color: var(--color-accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 1rem;">// ERROR 404</span>
        <h1 style="font-size: 2.2rem; font-weight: 700; color: #1d1d1f; margin-bottom: 1rem; letter-spacing: -0.02em;">Page Not Found</h1>
        <p style="font-size: 1rem; line-height: 1.55; color: #6e6e73; margin-bottom: 2rem;">The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn-primary" style="display: inline-flex; justify-content: center; text-decoration: none;">
            <span>Return to Homepage</span>
        </a>
    </div>
</body>
</html>
